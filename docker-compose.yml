services:
  app:
    image: ghcr.io/hackatoan/mosaic:latest
    container_name: mosaic
    restart: unless-stopped
    ports:
      - "3012:3000"
    volumes:
      # Only ever holds mosaics someone explicitly requested a shareable
      # link for (opt-in `share=true`) — never source/tile uploads.
      - ./data/results:/data/results
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_SITE_URL=https://mosaic.hackatoa.com
      - MOSAIC_MAX_SOURCE_MB=10
      - MOSAIC_MAX_TILE_MB=5
      - MOSAIC_MAX_TILES=120
      - MOSAIC_MIN_TILES=3
      - MOSAIC_RATE_LIMIT_MAX=12
      - MOSAIC_RATE_LIMIT_WINDOW_MS=600000
      - MOSAIC_RESULTS_DIR=/data/results
      - MOSAIC_SHARE_RETENTION_DAYS=14
      - MOSAIC_MIN_FREE_DISK_MB=500
      # Both read from a .env file placed next to this docker-compose.yml on
      # the server (not committed to git). Leave either unset to just hide
      # that tile-source mode — upload-your-own-tiles always works.
      - PEXELS_API_KEY=${PEXELS_API_KEY:-}
      - GOOGLE_DRIVE_API_KEY=${GOOGLE_DRIVE_API_KEY:-}
    labels:
      - "com.centurylinklabs.watchtower.enable=true"
