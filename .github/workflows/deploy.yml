name: Build and push to GHCR

on:
  push:
    branches: [main]

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          # NOTE: hardcoded lowercase — ${{ github.repository_owner }} resolves to
          # "Hackatoan" (capital H) and GHCR/Docker tags must be all-lowercase.
          tags: ghcr.io/hackatoan/mosaic:latest
